'Doğruların Birbirine Göre Durumları':{

'Aritmetik Ortalama':{

'Olasılık Problemleri':{

'İstatistiksel Araştırma Süreci':{

'İki Kategorik Değişkenli Problemler':{

'Kuvvet ve Hareket I':{

formula:'I=Q/t. Devrelerde akım ampermetreyle ölçülür ve seri bağlanır.',
symbols:'I: A, Q: C, t: s.',
tip:'Yük miktarını zamana böl.',
warning:'Akım yönü geleneksel olarak pozitif yüklerin hareket yönü kabul edilir.',
example:'10 C yük 2 s’de geçerse I=5 A.',
practice:'6 A akım 3 s sürerse geçen yük 18 C olur.'
},

'Ohm Yasası':{
intro:'Ohm yasası, ohmik bir iletkende gerilim, akım ve direnç arasındaki ilişkiyi verir.',
formula:'V=IR; buradan I=V/R ve R=V/I.',
symbols:'V: volt, I: amper, R: ohm.',
tip:'Soruda hangi üç büyüklükten ikisinin verildiğini belirle.',
warning:'Direnç sabit kabul edilen ohmik devrelerde ilişki doğrudan uygulanır.',
example:'V=20 V, R=5 Ω ise I=4 A.',
practice:'I=2 A ve V=12 V ise R=6 Ω.'
},

'Dalgalar':{
intro:'Dalgalar enerji taşır; maddeyi bütünüyle bir yerden başka yere taşımak zorunda değildir. Periyot, frekans, dalga boyu ve hız temel kavramlardır.',
formula:'v=λf; f=1/T.',
symbols:'v: m/s, λ: m, f: Hz, T: s.',
tip:'Dalganın türünü ve verilen nicelikleri yaz.',
warning:'Frekans ile periyodun ters orantılı olduğunu unutma.',
example:'λ=2 m ve f=5 Hz ise v=10 m/s.',
practice:'T=0,2 s ise f=5 Hz.'
},

'Dalga Hareketi':{
intro:'Dalga hareketi titreşimin ortamda veya boşlukta belirli biçimde yayılmasıdır. Mekanik dalgalar ortam gerektirir, elektromanyetik dalgalar gerektirmez.',
formula:'v=λf ve f=1/T.',
symbols:'λ: dalga boyu, f: frekans, T: periyot.',
tip:'Dalga üzerinde ardışık iki aynı fazlı nokta arasını dalga boyu olarak düşün.',
warning:'Genlik ile dalga boyunu karıştırma; genlik enerjiyle, dalga boyu uzaysal periyotla ilgilidir.',
example:'4 m dalga boyu ve 2 Hz frekans → 8 m/s.',
practice:'Frekans 4 Hz ise periyot 0,25 s olur.'
},

'Ses Dalgaları':{
intro:'Ses mekanik ve boyuna bir dalgadır; yayılması için maddesel ortam gerekir. Sesin hızı ortama ve koşullara bağlıdır.',
formula:'v=λf; yankı sorularında gidip gelme mesafesi dikkate alınır.',
symbols:'f: Hz, λ: m, v: m/s.',
tip:'Sesin hangi ortamda yayıldığını belirle.',
warning:'Ses boşlukta yayılmaz; frekans sesin ince/kalın algısıyla, genlik ise şiddetle ilişkilidir.',
example:'f=500 Hz ve λ=0,68 m ise v=340 m/s.',
practice:'Yankıda ölçülen süre gidiş-dönüş süresiyse mesafeyi hesaplarken 2d yolunu kullan.'
},

'Su Dalgaları':{
intro:'Su yüzeyindeki dalgalar enine görünüm sergileyebilir; yansıma, kırılma, girişim ve dalga boyu gibi özellikler incelenir.',
formula:'v=λf; ortam değişiminde frekans kaynak tarafından belirlenir, hız ve dalga boyu değişebilir.',
symbols:'λ: m, f: Hz, v: m/s.',
tip:'Dalganın derinlik veya ortam değiştirip değiştirmediğine bak.',
warning:'Ortam değişiminde frekansın korunması ile hızın değişmesi arasındaki ilişkiyi kullan.',
example:'Bir bölgede v=2 m/s, f=4 Hz ise λ=0,5 m.',
practice:'Yeni ortamda hız yarıya inip frekans sabit kalırsa dalga boyu da yarıya iner.'
},

/* KİMYA */

'Etkileşim':{intro:'Kimyasal etkileşimler atomların elektron düzenleri ve daha kararlı elektron dizilimlerine ulaşma eğilimleriyle ilişkilidir. Kimyasal türler arasındaki etkileşimler maddenin özelliklerini belirler.',formula:'İyonik bağda elektron alışverişi; kovalent bağda elektron ortaklaşması; metalik bağda metal katyonları ile serbest hareket eden elektronlar etkilidir.',symbols:'e⁻: elektron, Na⁺: katyon, Cl⁻: anyon.',tip:'Bir etkileşimi incelerken önce taneciklerin metal, ametal veya iyon olup olmadığına bak.',warning:'İyonik bağ ile moleküller arası etkileşim aynı şey değildir.',example:'Na atomu elektron vererek Na⁺, Cl atomu elektron alarak Cl⁻ oluşturabilir.',practice:'Mg atomunun iki elektron vermesiyle Mg²⁺ oluşur.'},

'Atomun Yapısı':{intro:'Atom; proton ve nötronlardan oluşan çekirdek ile çekirdek çevresindeki elektronlardan oluşur. Atomun kimliğini proton sayısı belirler.',formula:'Atom numarası Z=p. Kütle numarası A=p+n. Nötr atomda p=e.',symbols:'p⁺: proton, n⁰: nötron, e⁻: elektron, Z: atom numarası, A: kütle numarası.',tip:'İyonlarda proton sayısı değişmez; elektron sayısı değişir.',warning:'Kütle numarası elektronları değil proton ve nötronları kapsar.',example:'11 proton ve 12 nötron içeren nötr atom için Z=11, A=23 ve e=11.',practice:'Z=17 olan nötr atomda 17 proton ve 17 elektron bulunur.'},

'Periyodik Sistem':{intro:'Elementler artan atom numaralarına göre periyodik tabloda düzenlenir. Aynı gruptaki elementlerin değerlik elektronları ve kimyasal özelliklerinde benzerlikler görülebilir.',formula:'Periyot yatay, grup dikey sütundur. Ana grup elementlerinde grup numarası değerlik elektronlarıyla ilişkilidir.',symbols:'Z: atom numarası, grup, periyot.',tip:'Periyot sayısı elektron katmanlarının sayısıyla ilişkilidir.',warning:'Grup ile periyot yönünü karıştırma; periyot yatay, grup dikeydir.',example:'Na, 3. periyot ve 1A grubundadır.',practice:'Cl, 3. periyot 7A/17. grupta yer alır.'},

'Kimyasal Türler':{intro:'Kimyasal tür; atom, molekül, iyon gibi maddeleri oluşturan tanecik türlerini ifade eder.',formula:'Katyon elektron kaybederek pozitif, anyon elektron kazanarak negatif yüklenir.',symbols:'Atom: Na, molekül: H₂O, katyon: Na⁺, anyon: Cl⁻.',tip:'Yük işaretini belirlerken proton-elektron farkını düşün.',warning:'Elektron sayısındaki değişim iyon oluşturur; proton sayısındaki değişim elementin kimliğini değiştirir.',example:'Na → Na⁺ + e⁻; Cl + e⁻ → Cl⁻.',practice:'Al atomu 3 elektron verirse Al³⁺ olur.'},

'Kimyasal Bağlar':{intro:'Kimyasal bağlar atomların daha kararlı yapılara ulaşmasını sağlayan güçlü etkileşimlerdir. İyonik, kovalent ve metalik bağ temel bağ türleridir.',formula:'İyonik: elektron alışverişi; kovalent: elektron ortaklaşması; metalik: metal tanecikleri ve hareketli elektronlar.',symbols:'NaCl: iyonik, H₂O: kovalent, Cu: metalik.',tip:'Metal-ametal arasında iyonik; ametal-ametal arasında kovalent bağ görülmesi yaygındır.',warning:'Bir molekülün moleküller arası çekimlerini kimyasal bağlarla karıştırma.',example:'NaCl oluşurken Na elektron verir, Cl elektron alır.',practice:'O₂ molekülünde iki O atomu elektronlarını ortaklaşa kullanır.'},

'Çeşitlilik':{intro:'Maddeler saf maddeler ve karışımlar olarak sınıflandırılır. Saf maddeler element veya bileşik olabilir.',formula:'Element tek cins atom; bileşik farklı elementlerin belirli oranlarda kimyasal birleşimi; karışım birden fazla maddenin fiziksel birleşimidir.',symbols:'Element, bileşik, homojen karışım, heterojen karışım.',tip:'Kimyasal formülü sabit olan saf maddelerle karışımları ayır.',warning:'Karışımların bileşenleri fiziksel yöntemlerle ayrılabilir; bileşikler kimyasal yollarla ayrılır.',example:'O₂ element, H₂O bileşik, hava karışımdır.',practice:'Tuzlu su saf madde değil, homojen karışımdır.'},

'Maddenin Halleri':{intro:'Maddenin katı, sıvı, gaz ve bazı koşullarda plazma gibi halleri vardır. Haller arasındaki fark taneciklerin düzeni, hareketi ve aralarındaki boşlukla açıklanır.',formula:'Erime: katı→sıvı; donma: sıvı→katı; buharlaşma: sıvı→gaz; yoğuşma: gaz→sıvı; süblimleşme: katı→gaz.',symbols:'Q: ısı, T: sıcaklık.',tip:'Hal değişiminde madde aynı madde olarak kalır; taneciklerin düzeni ve enerjisi değişir.',warning:'Kaynama ile buharlaşma aynı değildir; buharlaşma her sıcaklıkta yüzeyden olabilir.',example:'Buzun erimesi fiziksel değişimdir.',practice:'Su buharının sıvı suya dönüşmesi yoğuşmadır.'},

'Karışımlar':{intro:'Karışımlar iki veya daha fazla maddenin kimyasal özelliklerini büyük ölçüde koruyarak bir araya gelmesiyle oluşur. Homojen karışımlar çözelti olarak adlandırılır.',formula:'Çözelti = çözücü + çözünen. Kütlece yüzde = çözünen kütlesi/toplam çözelti kütlesi ×100.',symbols:'Çözücü, çözünen, çözelti, %m/m.',tip:'Homojen karışım tek fazlı, heterojen karışım birden fazla fazlıdır.',warning:'Her karışım çözelti değildir; heterojen karışımlarda fazlar ayırt edilebilir.',example:'20 g tuz + 80 g su çözeltisinde kütlece tuz yüzdesi 20/100×100=%20 olur.',practice:'Kum-su heterojen, şekerli su homojen karışımdır.'},

'Asitler ve Bazlar':{intro:'Asit ve bazlar sulu çözeltilerde farklı kimyasal özellikler gösterir. pH, çözeltinin asitlik-bazlık durumunu ifade etmek için kullanılır.',formula:'pH<7 asidik, pH=7 nötr, pH>7 bazik. Güçlü asit ve güçlü bazlar suda daha fazla iyonlaşabilir.',symbols:'H⁺, OH⁻, pH.',tip:'pH azaldıkça asitlik, pH arttıkça bazlık artar.',warning:'Kuvvetli-zayıf ile derişik-seyreltik aynı kavramlar değildir.',example:'Limon suyu asidik, sabunlu su bazik özellik gösterebilir.',practice:'pH=3 olan çözelti pH=6 olana göre daha asidiktir.'},

'Kimyasal Tepkimeler':{intro:'Kimyasal tepkimelerde giren maddeler yeni maddelere dönüşür. Tepkime sırasında atomların türü korunur, yalnızca bağlanma biçimleri değişir.',formula:'Kütlenin korunumu: girenlerin toplam kütlesi = ürünlerin toplam kütlesi. Denklem katsayıları atom sayılarını eşitlemek için kullanılır.',symbols:'Girenler → ürünler; katsayı ve indis.',tip:'Denkleştirirken yalnızca katsayıları değiştir; formüllerdeki indisleri değiştirme.',warning:'İndisi değiştirmek maddenin kimliğini değiştirebilir.',example:'2H₂ + O₂ → 2H₂O denkleminde H ve O atom sayıları iki tarafta eşittir.',practice:'N₂ + 3H₂ → 2NH₃ denkleminde N ve H atomlarını kontrol et.'},

'Sürdürülebilirlik':{intro:'Kimyada sürdürülebilirlik; kaynakların verimli kullanılması, atıkların azaltılması, enerjinin etkin kullanılması ve çevresel etkilerin azaltılmasını kapsar.',formula:'Verim = yararlı çıktı/girdi ×100 olarak ifade edilebilir.',symbols:'Verim, geri dönüşüm, atık, yenilenebilir kaynak.',tip:'Bir uygulamayı değerlendirirken kaynak tüketimi, atık ve enerji kullanımını birlikte düşün.',warning:'Sürdürülebilirlik yalnızca geri dönüşümden ibaret değildir.',example:'Daha az enerji ve hammadde kullanan üretim yöntemleri kaynak kullanımını azaltabilir.',practice:'Atık oluşumunu kaynağında azaltmak sürdürülebilirliğe katkı sağlar.'},

'Kimya ve Çevre':{intro:'Kimya; hava, su ve toprak kirliliğinin nedenlerini anlamada ve arıtma yöntemleri geliştirmede önemli rol oynar.',formula:'Kirleticilerin etkisi; kaynak, miktar, yayılma ve canlılarla etkileşim gibi faktörlere bağlıdır.',symbols:'CO₂, SO₂, NOₓ, partikül madde.',tip:'Bir çevre sorununda kirleticinin kaynağını, etkisini ve azaltma yöntemini ayrı ayrı incele.',warning:'Her kimyasal aynı düzeyde zararlı değildir; miktar ve maruziyet koşulları önemlidir.',example:'Fosil yakıtların yanması CO₂ ve bazı kirleticilerin salımına neden olabilir.',practice:'Atık suların arıtılması su ekosistemlerine bırakılmadan önce kirleticilerin azaltılmasına yardımcı olur.'},

'Enerji Kaynakları':{intro:'Enerji kaynakları yenilenebilir ve yenilenemez olarak sınıflandırılabilir. Enerji üretiminde kaynak seçimi çevresel ve ekonomik sonuçlarla birlikte değerlendirilir.',formula:'Güneş, rüzgâr, hidroelektrik ve jeotermal yenilenebilir; kömür, petrol ve doğal gaz yenilenemez kaynaklardır.',symbols:'J: joule, kWh: kilovat-saat.',tip:'Bir enerji kaynağını değerlendirirken yenilenebilirlik, verim, emisyon ve kaynak sürekliliğini birlikte düşün.',warning:'Yenilenebilir bir kaynağın çevresel etkisinin sıfır olduğu anlamına gelmez.',example:'Güneş panelleri güneş ışınımını elektrik enerjisine dönüştürür.',practice:'Kömür, oluşumu çok uzun sürdüğü için yenilenemez enerji kaynağıdır.'},

'Birinci Dereceden Denklemler':{
intro:'Birinci dereceden denklem, bilinmeyenin en büyük kuvvetinin 1 olduğu denklemdir. Amaç bilinmeyeni tek başına bırakmaktır. Denklem çözerken eşitliğin iki tarafına aynı işlem uygulanır.',
formula:'ax+b=0 (a≠0) ise x=-b/a. Parantez varsa önce dağıtma yapılabilir; benzer terimler birleştirilir.',
symbols:'x: bilinmeyen, a ve b: sabit katsayılar.',
tip:'Önce parantezleri aç, sonra x’li terimleri bir tarafa ve sabitleri diğer tarafa topla.',
warning:'Bir terimi eşitliğin diğer tarafına geçirirken işaret değişir. Sonucu yerine yazarak mutlaka kontrol et.',
example:'3x-7=11 → 3x=18 → x=6. Kontrol: 3·6-7=11.',
practice:'5x+4=24 denkleminde x’i bul. Cevap: 4.'
},

'Birinci Dereceden Eşitsizlikler':{
intro:'Birinci dereceden eşitsizliklerde <, >, ≤ veya ≥ sembolleri kullanılır. Denklem çözmeye benzer şekilde işlem yapılır ancak negatif sayıyla çarpma veya bölmede yön değişir.',
formula:'ax+b>c için a>0 ise x>(c-b)/a; a<0 ise eşitsizlik yönü tersine döner.',
symbols:'< küçük, > büyük, ≤ küçük veya eşit, ≥ büyük veya eşit.',
tip:'Son adımda negatif bir sayıya bölüyorsan eşitsizlik işaretini mutlaka çevir.',
warning:'Eşitsizlikte yön değişimi yalnızca negatifle çarpma/bölmede gerekir; pozitif işlemde yön değişmez.',
example:'-2x+4≥10 → -2x≥6 → x≤-3. Negatife böldüğümüz için yön değişti.',
practice:'3x-5<10 için x<5.'
},

'Oran ve Orantı Problemleri':{
intro:'Oran ve orantı problemlerinde iki çokluğun karşılaştırılması veya doğru/ters orantılı değişimler modellenir. Önce hangi büyüklüklerin karşılaştırıldığını belirlemek gerekir.',
formula:'a/b=c/d ise ad=bc. Doğru orantıda x/y sabittir; ters orantıda x·y sabittir.',
symbols:'a:b oranı, x ve y değişken büyüklükler.',
tip:'Birimleri aynı türden yap ve verilen iki büyüklüğün doğru mu ters mi orantılı olduğunu belirle.',
warning:'Doğru orantı ile ters orantıyı karıştırma. Biri birlikte artarken diğerinde biri artınca diğeri azalır.',
example:'4 kalem 60 TL ise aynı kalemlerden 7 tanesi 7·15=105 TL olur. Çünkü fiyat adetle doğru orantılıdır.',
practice:'3 işçi bir işi 12 günde bitiriyorsa aynı hızla 6 işçi kaç günde bitirir? Cevap: 6 gün.'
},

'Sayı Problemleri':{
intro:'Sayı problemlerinde bilinmeyen sayı veya sayılar bir değişkenle ifade edilir ve metindeki ilişki bir denklem ya da eşitsizliğe dönüştürülür.',
formula:'Ardışık sayılar: n,n+1,n+2; ardışık çift sayılar: 2n,2n+2; ardışık tek sayılar: 2n+1,2n+3.',
symbols:'n veya x: bilinmeyen sayı.',
tip:'“Bir sayının 3 fazlası” x+3, “3 katı” 3x ve “3 eksiği” x-3 şeklinde yazılır.',
warning:'Dil bilgisini matematiğe çevirirken “katı”, “fazlası”, “eksiği” ifadelerini karıştırma.',
example:'Ardışık iki sayının toplamı 25 olsun: n+(n+1)=25 → 2n=24 → n=12. Sayılar 12 ve 13’tür.',
practice:'Bir sayının 4 katının 5 fazlası 29 ise sayı kaçtır? Cevap: 6.'
},

'Yaş Problemleri':{
intro:'Yaş problemlerinde kişilerin bugünkü yaşları arasındaki ilişki ve yıllar geçtikçe herkesin yaşının aynı miktarda artması kullanılır.',
formula:'t yıl sonra her kişinin yaşı +t, t yıl önce her kişinin yaşı -t olur. Yaş farkı zamanla değişmez.',
symbols:'x: bugünkü yaş, t: yıl sayısı.',
tip:'Önce bugünkü yaşları değişkenlerle yaz; sonra geçmiş veya gelecek zamana göre aynı t miktarını ekle/çıkar.',
warning:'Yaş farkı sabittir; ancak yaşların toplamı zamanla değişir.',
example:'Ali 12, Ece 18 yaşında. 4 yıl sonra yaşları 16 ve 22, fark yine 6’dır.',
practice:'Bir baba çocuğundan 24 yaş büyüktür. Çocuk 8 yaşındaysa baba 32 yaşındadır.'
},

'Hareket Problemleri':{
intro:'Hareket problemlerinde yol, hız ve zaman arasındaki ilişki kullanılır. Aynı doğrultuda hareket eden araçlarda yön ve başlangıç koşulları ayrıca değerlendirilir.',
formula:'Yol = Hız × Zaman. v=s/t, s=v·t, t=s/v.',
symbols:'s: yol (m veya km), v: hız (m/s veya km/sa), t: zaman (s veya sa).',
tip:'Hız ve zaman birimlerini uyumlu hale getir. Karşılaşma sorularında toplam yol ilişkisini kur.',
warning:'km/sa ile m/s birimlerini karıştırma. 1 m/s = 3,6 km/sa.',
example:'60 km/sa hızla 2 saatte alınan yol s=60·2=120 km olur.',
practice:'90 km/sa hızla 30 dakikada kaç km gidilir? Cevap: 45 km.'
},

'İşçi ve Havuz Problemleri':{
intro:'İşçi problemlerinde iş yapma hızları, havuz problemlerinde ise doldurma veya boşaltma hızları birlikte değerlendirilir. Temel fikir birim zamandaki iş miktarıdır.',
formula:'Bir işi tek başına T sürede yapanın 1 saatte yaptığı iş 1/T’dir. Birlikte çalışma hızları toplanır; boşaltma hızı eksi olarak alınır.',
symbols:'T: süre, 1/T: birim zamandaki iş miktarı.',
tip:'Önce herkesin bir saatte yaptığı iş miktarını yaz, sonra hızları birleştir.',
warning:'Süreleri doğrudan toplamak yerine iş yapma hızlarını toplamalısın.',
example:'Bir işçi işi 6 saatte, diğeri 3 saatte bitiriyor. Birlikte hızları 1/6+1/3=1/2 iş/saat olduğundan iş 2 saatte biter.',
practice:'Bir musluk havuzu 4 saatte dolduruyor, gider 12 saatte boşaltıyor. İkisi açıkken net hız 1/4-1/12=1/6; havuz 6 saatte dolar.'
},

'Kar-Zarar Problemleri':{
intro:'Kar-zarar problemlerinde alış fiyatı, satış fiyatı, kar veya zarar miktarı ve yüzde oranları arasındaki ilişki kullanılır.',
formula:'Kar=Satış−Alış. Zarar=Alış−Satış. Kar yüzdesi=(Kar/Alış)×100.',
symbols:'A: alış fiyatı, S: satış fiyatı, K: kar.',
tip:'Yüzde kar veya zarar oranında temel alınan değer genellikle alış fiyatıdır; sorunun tanımını dikkatle oku.',
warning:'%20 zam ile %20 indirim birbirini genel olarak götürmez. Yüzdelerin uygulandığı taban değerleri farklı olabilir.',
example:'200 TL’ye alınan ürün 250 TL’ye satılırsa kar 50 TL, kar yüzdesi 50/200×100=%25’tir.',
practice:'300 TL alış fiyatlı ürün %10 karla kaç TL’ye satılır? Cevap: 330 TL.'
},

'Üçgende Kenar Bağıntıları':{
intro:'Üçgende kenarlar ve açılar arasında önemli bağıntılar vardır. Büyük açının karşısında büyük kenar bulunur; üçgen eşitsizliği ise üç kenarın mümkün olup olmadığını kontrol eder.',
formula:'|b−c|<a<b+c. Benzer şekilde diğer kenarlar için de bu koşul sağlanır.',
symbols:'a,b,c: üçgenin kenar uzunlukları.',
tip:'Üç kenar verildiğinde önce en büyük kenarın, diğer iki kenarın toplamından küçük olup olmadığını kontrol et.',
warning:'Eşitlik durumunda üçgen oluşmaz; üçgen eşitsizliklerinde sınırlar kesin değil, sıkıdır.',
example:'3,4,6 kenarları üçgen oluşturur çünkü |4−6|=2<3<10=4+6.',
practice:'5 ve 8 uzunluklu iki kenar arasında üçüncü kenar x ise hangi aralıkta olmalıdır? Cevap: 3<x<13.'
},

'Permütasyon Problemleri':{
intro:'Permütasyon problemlerinde nesnelerin veya kişilerin sıralanması önemlidir. Sıra değişirse sonuç da değişir.',

"Pisagor Bağıntısı":["Pisagor Bağıntısı konusu şekillerde açı, kenar, alan, uzunluk ve benzerlik ilişkilerini kullanır. Şekli çizmek, verilenleri üzerine yazmak ve uygun yardımcı çizgiyi seçmek geometri sorularında önemli bir adımdır.", "Dik üçgende a²+b²=c²; c hipotenüstür. Eksik kenar için bilinen kenarların kareleri arasındaki ilişki kullanılır.", "Temel semboller ve kavramlar: Pisagor Bağıntısı. Soruda verilen niceliklerin birimlerini ve değişkenlerin neyi temsil ettiğini açıkça belirt.", "Önce soruda neyin verildiğini ve neyin istendiğini ayır. Ardından Pisagor Bağıntısı için uygun kuralı seçip işlemleri küçük adımlara böl; mümkünse sonucu başka bir yöntemle kontrol et.", "Tanım ve koşulları gözden kaçırma. Özellikle işaret, parantez, tanım kümesi, eşitlik/eşitsizlik yönü ve soruda verilen özel koşullar Pisagor Bağıntısı sorularında sonucu değiştirebilir.", "Dik kenarlar 6 ve 8 ise hipotenüs √(36+64)=10’dur.", "Pisagor Bağıntısı alıştırması: Konunun temel kuralını kullanarak orta düzey bir soru çöz. Çözümünün ilk adımını, kullandığın kuralı ve sonucun kontrolünü ayrı ayrı yaz."],

"Paralelkenar":["Paralelkenar konusu şekillerde açı, kenar, alan, uzunluk ve benzerlik ilişkilerini kullanır. Şekli çizmek, verilenleri üzerine yazmak ve uygun yardımcı çizgiyi seçmek geometri sorularında önemli bir adımdır.", "Karşı kenarlar paralel ve eşittir; karşı açılar eşittir. Alan=taban×yükseklik ve köşegenler birbirini ortalar.", "Temel semboller ve kavramlar: Paralelkenar. Soruda verilen niceliklerin birimlerini ve değişkenlerin neyi temsil ettiğini açıkça belirt.", "Önce soruda neyin verildiğini ve neyin istendiğini ayır. Ardından Paralelkenar için uygun kuralı seçip işlemleri küçük adımlara böl; mümkünse sonucu başka bir yöntemle kontrol et.", "Tanım ve koşulları gözden kaçırma. Özellikle işaret, parantez, tanım kümesi, eşitlik/eşitsizlik yönü ve soruda verilen özel koşullar Paralelkenar sorularında sonucu değiştirebilir.", "Tabanı 8, yüksekliği 5 olan paralelkenarın alanı 8·5=40 birim²dir.", "Paralelkenar alıştırması: Konunun temel kuralını kullanarak orta düzey bir soru çöz. Çözümünün ilk adımını, kullandığın kuralı ve sonucun kontrolünü ayrı ayrı yaz."],
"Yamuk":["Yamuk konusu şekillerde açı, kenar, alan, uzunluk ve benzerlik ilişkilerini kullanır. Şekli çizmek, verilenleri üzerine yazmak ve uygun yardımcı çizgiyi seçmek geometri sorularında önemli bir adımdır.", "En az bir çift karşı kenarı paralel olan dörtgendir. Alan=(alt taban+üst taban)×yükseklik/2.", "Temel semboller ve kavramlar: Yamuk. Soruda verilen niceliklerin birimlerini ve değişkenlerin neyi temsil ettiğini açıkça belirt.", "Önce soruda neyin verildiğini ve neyin istendiğini ayır. Ardından Yamuk için uygun kuralı seçip işlemleri küçük adımlara böl; mümkünse sonucu başka bir yöntemle kontrol et.", "Tanım ve koşulları gözden kaçırma. Özellikle işaret, parantez, tanım kümesi, eşitlik/eşitsizlik yönü ve soruda verilen özel koşullar Yamuk sorularında sonucu değiştirebilir.", "Tabanları 6 ve 10, yüksekliği 4 olan yamuğun alanı (6+10)·4/2=32 birim²dir.", "Yamuk alıştırması: Konunun temel kuralını kullanarak orta düzey bir soru çöz. Çözümünün ilk adımını, kullandığın kuralı ve sonucun kontrolünü ayrı ayrı yaz."],
"Deltoid":["Deltoid konusu şekillerde açı, kenar, alan, uzunluk ve benzerlik ilişkilerini kullanır. Şekli çizmek, verilenleri üzerine yazmak ve uygun yardımcı çizgiyi seçmek geometri sorularında önemli bir adımdır.", "İki çift komşu kenarı eşit olan dörtgendir. Köşegenler çoğu standart deltoid sorusunda dik kesişir ve alan köşegenler çarpımının yarısı ile bulunur.", "Temel semboller ve kavramlar: Deltoid. Soruda verilen niceliklerin birimlerini ve değişkenlerin neyi temsil ettiğini açıkça belirt.", "Önce soruda neyin verildiğini ve neyin istendiğini ayır. Ardından Deltoid için uygun kuralı seçip işlemleri küçük adımlara böl; mümkünse sonucu başka bir yöntemle kontrol et.", "Tanım ve koşulları gözden kaçırma. Özellikle işaret, parantez, tanım kümesi, eşitlik/eşitsizlik yönü ve soruda verilen özel koşullar Deltoid sorularında sonucu değiştirebilir.", "Deltoid için örnek: Sorudaki verilenleri sembollerle yaz, uygun temel bağıntıyı uygula ve elde ettiğin sonucu başlangıç koşullarına yerleştirerek kontrol et.", "Deltoid alıştırması: Konunun temel kuralını kullanarak orta düzey bir soru çöz. Çözümünün ilk adımını, kullandığın kuralı ve sonucun kontrolünü ayrı ayrı yaz."],
"Sinüs-Kosinüs":["Sinüs-Kosinüs konusu açıları ve kenar oranlarını ilişkilendirerek uzunluk ve açı hesaplamalarını mümkün kılar. Dik üçgen, özel açılar, birim çember ve trigonometrik özdeşlikler birlikte düşünülmelidir.", "Sinüs karşı/hipotenüs, kosinüs komşu/hipotenüs oranıdır. Genel üçgenlerde sinüs teoremi a/sin A=b/sin B=c/sin C ve kosinüs teoremi c²=a²+b²−2ab cos C kullanılabilir.", "Temel semboller ve kavramlar: Sinüs-Kosinüs. Soruda verilen niceliklerin birimlerini ve değişkenlerin neyi temsil ettiğini açıkça belirt.", "Önce soruda neyin verildiğini ve neyin istendiğini ayır. Ardından Sinüs-Kosinüs için uygun kuralı seçip işlemleri küçük adımlara böl; mümkünse sonucu başka bir yöntemle kontrol et.", "Tanım ve koşulları gözden kaçırma. Özellikle işaret, parantez, tanım kümesi, eşitlik/eşitsizlik yönü ve soruda verilen özel koşullar Sinüs-Kosinüs sorularında sonucu değiştirebilir.", "İki kenarı 5 ve 8, aralarındaki açı 60° ise alan=5·8·sin60°/2=10√3 birim²dir.", "Sinüs-Kosinüs alıştırması: Konunun temel kuralını kullanarak orta düzey bir soru çöz. Çözümünün ilk adımını, kullandığın kuralı ve sonucun kontrolünü ayrı ayrı yaz."],

========================================================= */

function db(){
 let x=JSON.parse(localStorage.getItem('HEDEFIM_DB')||'{}');
 x.users??={};
 x.session??=null;
 return x;
}

function save(x){
 localStorage.setItem('HEDEFIM_DB',JSON.stringify(x));
}

function u(){
 let x=db();
 return x.session?x.users[x.session]:null;
}

function esc(x){
 return String(x??'').replace(/[&<>"']/g,m=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#039;'
 }[m]));
}

function key(id,t){
 return id+'::'+t;
}


function isAdmin(){
 let z=u();
 return !!(z && (z.role==='admin' || z.username==='ebrar' || String(z.name||'').toLowerCase()==='ebrar'));
}

function applyRoleUI(){
 let admin=isAdmin();
 document.querySelectorAll('.nav').forEach(n=>{
  let p=n.dataset.p;
  let adminOnly=['progress','surprises','cartoons','sounds','add','addsubject'];
  n.style.display=adminOnly.includes(p)&&!admin?'none':'';
 });
 let e=document.querySelector('[data-p="ebrar"]');
 if(e) e.textContent=admin?'👩‍🏫 Ebrar':'🤖 Ebrar’a Sor';
}

function adminUser(){
 let x=db();
 return Object.values(x.users||{}).find(a=>a.role==='admin'||a.username==='ebrar'||String(a.name||'').toLowerCase()==='ebrar');
}

function loadCustomSubjects(){
 let x=db();
 (x.subjects||[]).forEach(s=>{ if(!S.some(q=>q[0]===s[0])) S.push(s); });
}

   GİRİŞ / KAYIT
========================================================= */

function mode(m){
 lf.classList.toggle('hidden',m!=='login');
 rf.classList.toggle('hidden',m!=='reg');
 lt.classList.toggle('active',m==='login');
 rt.classList.toggle('active',m==='reg');
}

function register(){

 let n=rn.value.trim();
 let a=ru.value.trim().toLowerCase();
 let p=rp.value;
 let p2=rp2.value;
 let invite=(rinvite?.value||'').trim();

 if(!n||!a||!p||!invite)return alert('Tüm alanları doldur ve davet kodunu gir.');

 let x=db();
 x.settings??={};
 x.settings.inviteCode??='HEDEFIM-2026';
 if(invite!==x.settings.inviteCode)return alert('HEDEFİM davet kodu hatalı.');
 if(p.length<4)return alert('Şifre en az 4 karakter.');
 if(p!==p2)return alert('Şifreler aynı değil.');

 if(x.users[a])return alert('Bu kullanıcı adı kayıtlı.');

 let r=prompt('Şifre kurtarma cevabın:');
 if(!r)return;

 x.users[a]={
  name:n,
  username:a,
  password:p,
  recovery:r.toLowerCase().trim(),
  progress:{},
  quiz:{},
  custom:[],
  messages:[],
  sent:[],
  notes:[],
  advice:[],
  announcements:[],
  programs:[],
  surprises:true,
  role:(a==='ebrar'||n.toLowerCase()==='ebrar')?'admin':'student',
  individual:{},
  notifications:[]
 };

 x.session=a;
 save(x);
 open();
}

function login(){

 let a=lu.value.trim().toLowerCase();
 let p=lp.value;
 let x=db();

 if(!x.users[a]||x.users[a].password!==p)
 return alert('Kullanıcı adı veya şifre hatalı.');

 x.session=a;
 save(x);
 open();
}

function forgot(){

 let a=prompt('Kullanıcı adı:');
 let x=db();

 a=a?.toLowerCase().trim();

 if(!a||!x.users[a])return alert('Kullanıcı bulunamadı.');

 let r=prompt('Kurtarma cevabı:');

 if(r?.toLowerCase().trim()!==x.users[a].recovery)
 return alert('Cevap yanlış.');

 let p=prompt('Yeni şifre:');

 if(!p||p.length<4)return alert('Geçersiz şifre.');

 x.users[a].password=p;
 save(x);

 alert('Şifre değiştirildi.');
}

function logout(){

 let x=db();
 x.session=null;
 save(x);

 clearTimeout(surpriseTimer);

 app.classList.add('hidden');
 auth.classList.remove('hidden');

 mode('login');
}

function open(){

 let z=u();

 if(!z)return;

 loadCustomSubjects();
 applyRoleUI();

 auth.classList.add('hidden');
 app.classList.remove('hidden');

 uname.textContent=z.name;
 ava.textContent=z.name[0].toUpperCase();

 go('home');
 startSurpriseTimer();
}

function all(){

 let a=[];

 S.forEach(s=>
  s[3].forEach(g=>
   g[1].forEach(t=>
    a.push({s,g:g[0],t,custom:false})
   )
  )
 );

 let z=u();

 (z?.custom||[]).forEach(x=>{

  let s=S.find(y=>y[0]===x.s);

  if(s)
  a.push({
   s,
   g:'Yeni Konular',
   t:x.t,
   custom:true
  });

 });

 return a;
}

function pct(){

 let a=all();
 let z=u();

 let d=a.filter(x=>z.progress[key(x.s[0],x.t)]?.done).length;

 return a.length?Math.round(d/a.length*100):0;
}

function card(s){

 let a=all().filter(x=>x.s[0]===s[0]);
 let z=u();

 let d=a.filter(x=>z.progress[key(s[0],x.t)]?.done).length;

 let p=a.length?Math.round(d/a.length*100):0;

 return `
 <div class="card">
  <div class="icon">${s[1]}</div>
  <h3>${esc(s[2])}</h3>
  <p class="muted">${d}/${a.length} konu tamamlandı</p>
  <div class="progress"><div style="width:${p}%"></div></div>
  <button class="btn" style="margin-top:10px" onclick="subject('${s[0]}')">Derse Gir →</button>
 </div>
 `;
}

function makeQuiz(id,t){

 let bank=QUIZ_BANK[t];

 let first;

 if(bank){
  first=bank.slice(0,7).map(x=>({
   q:x[0],
   o:x[1],
   a:x[2],
   y:false
  }));
 }else{
  first=generatedQuestions(id,t).slice(0,7).map(x=>({
   q:x[0],
   o:x[1],
   a:x[2],
   y:false
  }));
 }

 let last=[];

 if(bank){
  last=bank.slice(0,5).map((x,i)=>({
   q:'YKS '+(i+1)+' — '+x[0],
   o:x[1],
   a:x[2],
   y:true
  }));
 }else{

  let d=data(id,t);

  last=[
   {
    q:`YKS 1 — ${t} sorusunda aşağıdaki çalışma yaklaşımı hangisidir?`,
    o:[
     'Tanımı ve verilenleri belirleyip uygun yöntemi seçmek',
     'Soruyu okumadan işlem yapmak',
     'Koşulları yok saymak',
     'Sonucu rastgele seçmek'
    ],
    a:0,y:true
   },
   {
    q:`YKS 2 — ${t} konusunda bir soruyu çözerken hangisi en doğrudur?`,
    o:[
     'Kavramı sorudaki bilgiyle ilişkilendirmek',
     'Formülü rastgele seçmek',
     'Bütün bilgileri yok saymak',
     'Sadece cevap harfine bakmak'
    ],
    a:0,y:true
   },
   {
    q:`YKS 3 — ${t} sorusunda hata yaptığını fark eden öğrenci ne yapmalıdır?`,
    o:[
     'Hatanın hangi adımda oluştuğunu incelemek',
     'Soruyu tamamen bırakmak',
     'Cevabı değiştirmek',
     'Soruyu okumamak'
    ],
    a:0,y:true
   },
   {
    q:`YKS 4 — ${t} için verilen bilgi ile istenen arasındaki ilişkiyi kurmanın amacı nedir?`,
    o:[
     'Uygun çözüm yolunu belirlemek',
     'Soruyu uzatmak',
     'Cevabı rastgele seçmek',
     'Formülleri yok saymak'
    ],
    a:0,y:true
   },
   {
    q:`YKS 5 — ${t} konusunda işlem sonunda ne yapılmalıdır?`,
    o:[
     'Sonuç ve koşullar kontrol edilmelidir',
     'Birimler silinmelidir',
     'Sonuç değiştirilmelidir',
     'Sorudaki bilgiler unutulmalıdır'
    ],
    a:0,y:true
   }
  ];
 }

 return [...first,...last];
}

function quiz(id,t){

 let qs=makeQuiz(id,t);

 c.innerHTML=`

 <button class="btn gray"
 onclick="topic('${id}',${JSON.stringify(t)})">
 ← Konuya dön
 </button>

 <h1>🧪 ${esc(t)} — 7 + 5 YKS</h1>

 <p class="muted">
 İlk 7 soru konu testi, son 5 soru YKS bölümüdür.
 </p>

 <div id="qa">

 ${qs.map((q,i)=>`

 <div class="q">

  <div class="kpi">
   ${q.y?'🎯 YKS Sorusu':'📚 Konu Sorusu'} • ${i+1}/12
  </div>

  <br>

  <b>${esc(q.q)}</b>

  ${q.o.map((o,j)=>`

   <button class="opt"
    onclick="sel(this,${i},${j})">

    ${String.fromCharCode(65+j)}) ${esc(o)}

   </button>

  `).join('')}

 </div>

 `).join('')}

 <button class="btn"
 onclick='finish(
 ${JSON.stringify(id)},
 ${JSON.stringify(t)},
 ${JSON.stringify(qs)}
 )'>

 Quiz'i Bitir

 </button>

 </div>
 `;
}

function sel(b,i,j){

 b.parentElement
  .querySelectorAll('.opt')
  .forEach(x=>x.classList.remove('sel'));

 b.classList.add('sel');
 b.dataset.a=j;
}

function finish(id,t,qs){

 let score=0;

 document.querySelectorAll('.q')
 .forEach((q,i)=>{

  let s=q.querySelector('.sel');

  if(s&&+s.dataset.a===qs[i].a)
  score++;

 });

 let x=db();
 let z=u();

 let k=key(id,t);

 z.quiz[k]={
  score,
  total:12,
  date:Date.now()
 };

 save(x);

 let percent=Math.round(score/12*100);

 let message=
  score>=10?'🔥 Harika!':
  score>=8?'👏 Çok iyi!':
  score>=6?'💪 Güzel gidiyorsun!':
  '📚 Konuyu biraz daha tekrar et.';

 c.innerHTML=`

 <div class="card" style="text-align:center">

  <div style="font-size:60px">🎉</div>

  <h1>Quiz Tamamlandı!</h1>

  <div class="stat">${score}/12</div>

  <h2>${message}</h2>

  <p>${percent}% başarı</p>

  <div class="progress">
   <div style="width:${percent}%"></div>
  </div>

  <p>
   7 konu sorusu + 5 YKS sorusu sonucu kaydedildi.
  </p>

  <button class="btn"
   onclick="topic('${id}',${JSON.stringify(t)})">
   Konuya Dön
  </button>

 </div>
 `;
}

let liveStream=null;
async function startCamera(){
 try{ liveStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); localVideo.srcObject=liveStream; liveStatus.textContent='🎥 Kamera ve mikrofon hazır.'; }catch(e){ liveStatus.textContent='Kamera/mikrofon izni alınamadı: '+e.message; }
}
async function shareScreen(){
 try{ let stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false}); localVideo.srcObject=stream; liveStatus.textContent='🖥️ Ekran paylaşımı başladı.'; stream.getVideoTracks()[0].addEventListener('ended',()=>{liveStatus.textContent='Ekran paylaşımı sona erdi.';}); }catch(e){ liveStatus.textContent='Ekran paylaşımı başlatılamadı: '+e.message; }
}
function stopLive(){ if(liveStream)liveStream.getTracks().forEach(t=>t.stop()); if(document.getElementById('localVideo'))localVideo.srcObject=null; if(document.getElementById('liveStatus'))liveStatus.textContent='⏹ Canlı cihaz bağlantısı durduruldu.'; }

let selectedSound='pop';

function playSurpriseSound(){

 try{

  const AudioContext=
   window.AudioContext||
   window.webkitAudioContext;

  const ctx=new AudioContext();

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.frequency.value=
   selectedSound==='bell'?700:
   selectedSound==='fun'?420:
   520;

  gain.gain.setValueAtTime(.08,ctx.currentTime);

  osc.start();

  osc.frequency.exponentialRampToValueAtTime(
   800,
   ctx.currentTime+.15
  );

  osc.stop(ctx.currentTime+.18);

 }catch(e){}
}

 z.custom.some(a=>a.s===ns.value&&a.t.toLowerCase()===t.toLowerCase());

 if(exists)return alert('Bu konu zaten eklenmiş.');

 z.custom.push({
  s:ns.value,
  t
 });

 save(x);

 alert('✅ Yeni konu eklendi.');
 add();
}

function delTopic(i){

 let x=db();
 let z=u();

 if(!confirm('Bu konuyu silmek istediğine emin misin?'))return;

 z.custom.splice(i,1);

 save(x);

 add();
}


/* =========================================================
   PROFİL
========================================================= */

function profile(){

 let z=u();

 c.innerHTML=`

 <h1>👤 Profilim</h1>

 <div class="card" style="max-width:650px">

  <div class="avatar">
   ${esc(z.name[0].toUpperCase())}
  </div>

  <h2>${esc(z.name)}</h2>

  <p class="muted">@${esc(z.username)}</p>

  <hr>

  <h3>📊 Profil Özeti</h3>

  <p>
   Toplam konu: <b>${all().length}</b>
  </p>

  <p>
   Tamamlanan: <b>
   ${all().filter(x=>z.progress[key(x.s[0],x.t)]?.done).length}
   </b>
  </p>

  <p>
   Genel ilerleme: <b>${pct()}%</b>
  </p>

  <hr>

  <h3>🔑 Şifre Değiştir</h3>

  <input id="old" type="password"
   placeholder="Mevcut şifre">

  <br><br>

  <input id="np" type="password"
   placeholder="Yeni şifre">

  <br><br>

  <button class="btn" onclick="pass()">
   Şifreyi Değiştir
  </button>

 </div>
 `;
}

function pass(){

 let x=db();
 let z=u();

 if(old.value!==z.password)
 return alert('Mevcut şifre yanlış.');

 if(np.value.length<4)
 return alert('Yeni şifre en az 4 karakter.');

 z.password=np.value;

 save(x);

 alert('Şifre değiştirildi.');

 profile();
}
